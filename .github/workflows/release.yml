name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build English 3DSX in devkitARM
        run: |
          docker run --rm \
            -e DEVKITPRO=/opt/devkitpro \
            -e DEVKITARM=/opt/devkitpro/devkitARM \
            -v "$PWD":/work -w /work devkitpro/devkitarm:latest bash -lc '
            export PATH=/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:$PATH
            apt-get update &&
            apt-get install -y --no-install-recommends \
              build-essential g++ libpng-dev pkg-config python3 python3-pil git ca-certificates &&
            python3 tools/bootstrap.py --clean &&
            make -C build/upstream tools -j4 &&
            make -C build/upstream generated -j4 &&
            make -C build/upstream/3ds_port -j4 PYTHON=python3 emerald3ds.3dsx'

      - name: Stage release assets
        run: |
          mkdir -p ship
          cp build/upstream/3ds_port/emerald3ds.3dsx ship/Emerald3DS.3dsx
          cp build/upstream/3ds_port/emerald3ds.smdh ship/Emerald3DS.smdh

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ship/Emerald3DS.3dsx
            ship/Emerald3DS.smdh
          generate_release_notes: true
